# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smith
        run: curl -fsSL https://raw.githubusercontent.com/monosmith-app/monosmith/main/install.sh | sh -s -- "$SMITH_VERSION"
        env:
          SMITH_VERSION: 1.12.2
          GITHUB_TOKEN: ${{ github.token }}
      # smith:slot before-setup
      # The lockfile is written by npm 12: npm 11 prunes the nested @emnapi entries of the
      # wasm32-wasi bindings, and npm 12's npm ci then refuses it (AGENTS.md).
      - name: Pin npm 12
        run: npm install -g npm@12
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
      - name: Audit
        run: smith ci audit
      - name: Verify
        run: smith ci verify
      # smith:slot after-verify
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci pack
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore
      - name: Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
