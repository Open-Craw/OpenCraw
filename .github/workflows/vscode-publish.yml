# Publishes the VS Code extension to the Visual Studio Marketplace and to Open VSX (VSCodium, Cursor).
# Runs when something the extension is built from lands on main, or by hand (Actions > vscode-publish >
# Run workflow). It publishes only when the version in apps/vscode-extension/package.json is not on the
# Marketplace yet: raise `version` in the change that should reach users, and a merge with the same version
# is a no-op (a registry refuses a version it already has). No release tag is involved. Needs repository
# secrets, owned by the maintainer:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID  a Microsoft Entra application that is a member of the Marketplace
#     publisher named in that package.json, with a federated credential for this repository's `main`
#     branch. No token is stored: the job exchanges GitHub's OIDC token for an Entra one, so the
#     Marketplace job runs from `main` only. Azure DevOps PATs are retired on 2026-12-01.
#   OVSX_PAT  an open-vsx.org access token, for the same publisher name (a namespace there)
# A registry whose secret is not set is skipped, and the run says so. Issue #228.
name: vscode-publish

on:
  push:
    branches: [main]
    # The extension and everything bundled into its package (see PACKAGES in the packaging script).
    paths:
      - apps/vscode-extension/**
      - apps/studio-ui/**
      - packages/core/**
      - packages/office-reader/**
      - packages/probe/**
      - packages/studio/**
      - packages/cli/**
      - .github/workflows/vscode-publish.yml
  workflow_dispatch:
    inputs:
      marketplace:
        description: Publish to the Visual Studio Marketplace
        type: boolean
        default: true
      openvsx:
        description: Publish to Open VSX
        type: boolean
        default: true

# One publish at a time; a later merge waits for the running one instead of racing it for the version.
concurrency:
  group: vscode-publish
  cancel-in-progress: false

jobs:
  version:
    # Decides whether this run has anything to publish: the manifest's version must be new to the Marketplace.
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compare with the published versions
        id: compare
        run: |
          manifest=apps/vscode-extension/package.json
          version=$(node -p "require('./$manifest').version")
          id="$(node -p "require('./$manifest').publisher").opencraw"
          echo "manifest version $version, extension $id"
          if published=$(npx --yes @vscode/vsce@4.0.0 show "$id" --json 2>/dev/null); then
            if echo "$published" | node -e "const e = JSON.parse(require('fs').readFileSync(0, 'utf8')); process.exit((e.versions ?? []).some(v => v.version === process.argv[1]) ? 0 : 1)" "$version"; then
              echo "$version is already on the Marketplace: nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "$id is not on the Marketplace yet"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    if: ${{ needs.version.outputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    # One package per platform: the engine's native modules are installed for the runner's own platform.
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The npm scripts run smith (MonoSmith); the same installer the generated ci.yml uses.
      - name: Install smith
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/monosmith-app/monosmith/main/install.sh | sh -s -- "$SMITH_VERSION"
          # install.sh adds its folder to PATH in Git Bash form, which cmd and PowerShell cannot use
          # (monosmith-app/monosmith#290): add the Windows form too.
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
        env:
          SMITH_VERSION: 1.10.0
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - name: Package the extension
        run: npm run vscode:package
      - uses: actions/upload-artifact@v4
        with:
          name: opencraw-vscode-${{ runner.os }}
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error

  marketplace:
    needs: package
    # A push publishes to the Marketplace; a manual run can untick it. The federated credential trusts `main`
    # only, so any other ref skips the job instead of failing the login.
    if: ${{ (github.event_name == 'push' || inputs.marketplace) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opencraw-vscode-*
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sign in to Microsoft Entra
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath *.vsix --azure-credential

  openvsx:
    needs: package
    if: ${{ github.event_name == 'push' || inputs.openvsx }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opencraw-vscode-*
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: List what is published
        run: ls -l *.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT is not set: skipping Open VSX"; exit 0; fi
          for package in *.vsix; do
            npx --yes ovsx@1.2.0 publish "$package" --pat "$OVSX_PAT"
          done
