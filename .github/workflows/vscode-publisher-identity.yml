# Prints the Azure DevOps profile id of the Entra application that publishes the VS Code extension.
# The Marketplace's "Add member" asks for that id, and an application only has one after it has
# authenticated to Azure DevOps once: this signs in with the same federated credential as vscode-publish
# and asks for its own profile, which creates it. Run it by hand (Actions > vscode-publisher-identity),
# add the printed id as a Contributor on the publisher, then delete this file. Issue #228.
name: vscode-publisher-identity

on:
  workflow_dispatch:

jobs:
  identity:
    # The federated credential trusts `main` only.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Microsoft Entra
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Ask Azure DevOps for the application's profile
        # 499b84ac-... is the Azure DevOps resource id.
        run: |
          az rest --method get \
            --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "{id: id, displayName: displayName, tenant: coreAttributes.TenantId.value}" \
            --output json
