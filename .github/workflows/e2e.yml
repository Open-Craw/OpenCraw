# Browser end-to-end tests for @opencraw/core, @opencraw/office-reader's
# check that its published bundle runs in a browser, and
# @opencraw/captcha-tesseract's reads of rendered captchas. Kept out of ci.yml on purpose:
# that file is owned and rewritten by `mnci upgrade`, this one is ours.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run core:e2e
      # The recording flows open a headed window: a virtual display stands in for a screen.
      - run: xvfb-run -a npm run studio:e2e
      # The desktop app: a real Electron window against the built UI.
      - run: xvfb-run -a npm run studio-desktop:e2e
      - run: npm run office-reader:e2e
      - run: npm run captcha-tesseract:e2e
      # Every example's recipes load and bind; the examples that run offline run.
      - run: npm run examples:check
      - run: npm run examples:test
      # The how-it-works guide's scene recipes load and bind (the capture itself runs on demand).
      - run: npm run docs:check
