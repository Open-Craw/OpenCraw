# Browser end-to-end tests for @opencraw/core, @opencraw/office-reader's
# check that its published bundle runs in a browser, and
# @opencraw/captcha-tesseract's reads of rendered captchas. Kept out of ci.yml on purpose:
# that file is generated by `smith ci generate`, this one is ours. Each e2e task installs its browsers
# first (the playwright convention, e2e-browsers) and runs under xvfb-run itself when it opens windows.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The npm scripts run smith (MonoSmith); the same installer the generated ci.yml uses.
      - name: Install smith
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/monosmith-app/monosmith/main/install.sh | sh -s -- "$SMITH_VERSION"
          # install.sh adds its folder to PATH in Git Bash form, which cmd and PowerShell cannot use
          # (monosmith-app/monosmith#290): add the Windows form too.
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
        env:
          SMITH_VERSION: 1.10.0
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run core:e2e
      # The recording flows open a headed window: a virtual display stands in for a screen.
      - run: npm run studio:e2e
      # The desktop app: a real Electron window against the built UI.
      - run: npm run studio-desktop:e2e
      - run: npm run office-reader:e2e
      - run: npm run captcha-tesseract:e2e
      # Every example's recipes load and bind; the examples that run offline run.
      - run: npm run examples:check
      - run: npm run examples:test
      # The how-it-works guide's scene recipes load and bind (the capture itself runs on demand).
      - run: npm run docs:check
