[project]
name = "opencraw"
version = "0.0.1"
description = "Build OpenCraw recipes in Python, drive the real OpenCraw CLI, and write hooks in Python."
readme = "README.md"
license = "MIT"
keywords = ["opencraw", "crawler", "scraping", "recipes"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/Open-Craw/OpenCraw"
Repository = "https://github.com/Open-Craw/OpenCraw"
Issues = "https://github.com/Open-Craw/OpenCraw/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
# Stub-less third-party packages, and ONLY those. Measured on a generated
# project: plain strict passes out of the box, and the one thing that breaks it
# in practice is importing a library that ships no type stubs - "import yaml"
# fails as import-untyped on code you wrote normally and cannot fix. Disabling
# that one code keeps every other strict check on your own code, and a module
# that genuinely cannot be found still fails, as import-not-found.
disable_error_code = ["import-untyped"]
